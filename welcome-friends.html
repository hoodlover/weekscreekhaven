<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Your Welcome | Weeks Creek Haven</title>
  <link rel="icon" href="/webpic/weeks-creek-haven-favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/webpic/weeks-creek-haven-favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/webpic/weeks-creek-haven-favicon-16.png">
  <link rel="manifest" href="/manifest.json?v=17">
  <meta name="theme-color" content="#A45D41">
  <link rel="apple-touch-icon" sizes="192x192" href="/webpic/pwa-wch-192-v3.png">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,600;0,700;1,600&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --cream:#f4eee0; --paper:#fffaf0; --pine:#173a2c; --rust:#a45d41; --ink:#342920; --muted:#74685e; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; min-height:100vh; font-family:Montserrat,sans-serif; color:var(--ink); background:#17130f url('webpic/lightbardwood.webp') center/cover fixed; }
    body::before { content:""; position:fixed; inset:0; background:linear-gradient(135deg,rgba(5,12,8,.78),rgba(34,21,14,.55)); z-index:-1; }
    main { width:min(1040px,calc(100% - 28px)); margin:auto; padding:18px 0 45px; }
    .brand { display:flex; justify-content:center; align-items:center; gap:10px; color:var(--cream); margin-bottom:14px; text-transform:uppercase; letter-spacing:.17em; font-size:.68rem; font-weight:800; }
    .brand img { width:75px; height:75px; object-fit:contain; filter:drop-shadow(0 5px 10px rgba(0,0,0,.45)); }
    @media(max-width:600px) { .brand img { width:98px; height:98px; } }
    .card { overflow:hidden; background:rgba(255,250,240,.97); border:1px solid rgba(255,255,255,.32); border-radius:24px; box-shadow:0 25px 70px rgba(0,0,0,.48); }
    .photos { display:grid; min-height:340px; background:transparent; }
    .photos.count-1 { grid-template-columns:1fr; }
    .photos.count-2 { grid-template-columns:1fr 1fr; }
    .photos.count-3 { grid-template-columns:1.25fr .75fr; grid-template-rows:1fr 1fr; }
    .photos.count-3 img:first-child { grid-row:1/3; }
    .photos img { width:100%; height:100%; min-height:170px; object-fit:cover; display:block; border:1px solid rgba(255,255,255,.1); }
    .photos.feature-art { min-height:0; padding:16px; background:transparent; }
    .photos.feature-art img { height:auto; min-height:0; object-fit:contain; border:0; }
    .welcome { padding:clamp(28px,5vw,58px); text-align:center; }
    .eyebrow { color:var(--rust); font-size:.7rem; text-transform:uppercase; letter-spacing:.22em; font-weight:800; margin-bottom:10px; }
    h1 { margin:0; color:var(--pine); font:italic 700 clamp(2.8rem,8vw,5.7rem)/.93 'Crimson Text',serif; }
    h2 { margin:12px 0 0; color:#5d4a3d; font:600 clamp(1.2rem,3vw,1.8rem)/1.2 'Crimson Text',serif; }
    .message { max-width:700px; margin:24px auto; white-space:pre-line; color:var(--muted); font-size:clamp(.95rem,2vw,1.1rem); line-height:1.75; }
    .stay-box { max-width:760px; margin:0 auto 26px; padding:20px; border:1px solid #d7c8b4; border-radius:16px; background:#f5eddf; text-align:left; }
    .stay-box h3 { margin:0 0 5px; color:var(--pine); font:700 1.55rem 'Crimson Text',serif; }
    .stay-helper { margin:0 0 14px; color:var(--muted); font-size:.76rem; line-height:1.55; }
    .stay-options { display:grid; gap:10px; }
    .stay-option { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; padding:14px; border-radius:11px; background:white; border:1px solid #dfd4c5; }
    .stay-option.selected { border:2px solid var(--pine); background:#e8f0e8; }
    .stay-option.expired { opacity:.65; background:#eee9e2; }
    .stay-option strong { display:block; color:var(--ink); font-size:.88rem; }
    .stay-meta { color:var(--muted); font-size:.7rem; line-height:1.5; margin-top:4px; }
    .deadline { color:#8a2f2f; font-weight:700; }
    .choose { display:inline-block; border:0; border-radius:999px; background:var(--rust); color:white; padding:10px 14px; font:800 .65rem Montserrat,sans-serif; text-transform:uppercase; text-decoration:none; text-align:center; letter-spacing:.07em; cursor:pointer; }
    .choose:disabled { background:#9d948c; cursor:not-allowed; }
    .rule { width:80px; height:3px; background:var(--rust); margin:23px auto; }
    .enter { display:inline-block; text-decoration:none; background:var(--pine); color:white; padding:15px 27px; border-radius:999px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; font-size:.78rem; box-shadow:0 10px 24px rgba(23,58,44,.25); }
    .enter:hover { background:#0b251a; transform:translateY(-1px); }
    .welcome-actions { display:flex; justify-content:center; gap:9px; flex-wrap:wrap; }
    .enter.packet { background:var(--rust); }
    .enter.packet:hover { background:#813f2b; }
    .aside { display:block; color:#8d8178; font-size:.72rem; margin-top:14px; }
    .loading { min-height:110px; display:grid; place-items:center; color:var(--cream); text-align:center; font-family:'Crimson Text',serif; font-size:1.35rem; }
    .error { max-width:520px; margin:15vh auto; padding:35px; border-radius:18px; background:var(--paper); text-align:center; }
    .error h1 { font-size:2.5rem; }
    @media (max-width:650px) { main { padding-top:12px; } .photos { min-height:260px; } .photos.count-3 { grid-template-columns:1fr 1fr; grid-template-rows:220px 125px; } .photos.count-3 img:first-child { grid-column:1/3; grid-row:auto; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><a href="/index.html" aria-label="Weeks Creek Haven home"><img src="webpic/weeks-creek-haven-round-logo.png" alt="Weeks Creek Haven"></a><span>Weeks Creek Haven</span></div>
    <div id="loading" class="loading">Getting your welcome ready...</div>
    <article id="welcome-card" class="card" hidden>
      <div class="welcome">
        <div class="eyebrow">Someone up here is glad you came</div>
        <h1 id="visitor-heading">Welcome</h1>
        <h2 id="invite-label"></h2>
        <div class="rule"></div>
        <p id="message" class="message"></p>
        <section id="stay-box" class="stay-box" hidden><h3 id="stay-heading">Choose your stay</h3><p id="stay-helper" class="stay-helper"></p><div id="stay-options" class="stay-options"></div></section>
        <div class="welcome-actions"><a class="enter" href="/friends-hub.html">Enter the Friends Hub &rarr;</a><a id="booking-packet-link" class="enter packet" href="#" hidden>Booking &amp; signing packet</a></div>
        <span class="aside">Cabin details, directions, Wi-Fi, hot tub guide, and everything else await.</span>
      </div>
      <div id="photos" class="photos"></div>
    </article>
    <section id="error" class="error" hidden>
      <h1>Let&rsquo;s try that again.</h1>
      <p id="error-message"></p>
      <a class="enter" href="/important-info.html">Return to invite sign-in</a>
    </section>
  </main>
  <script>
    const escapeText = (value) => String(value || '').trim();
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const formatStayDate = (value) => value ? new Intl.DateTimeFormat(undefined,{dateStyle:'medium'}).format(new Date(`${value}T12:00:00`)) : '';
    const estimatedTaxesAndFees = (option) => Math.round(option.costCents*.07)+Math.round(option.costCents*.06)+Math.max(1,Math.round((Date.parse(`${option.departure}T00:00:00Z`)-Date.parse(`${option.arrival}T00:00:00Z`))/86400000))*500;
    async function selectStay(choice, button) {
      if(!confirm('Choose this stay? The other offered dates will be released.'))return;
      button.disabled=true; button.textContent='Reserving...';
      try {
        const response=await fetch('/api/invite-select-stay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choice})});
        const result=await response.json().catch(()=>({})); if(!response.ok)throw new Error(result.error||'That stay could not be selected.');
        if(result.warning)alert(result.warning); location.reload();
      } catch(error) { alert(error.message); button.disabled=false; button.textContent='Choose this stay'; }
    }
    function renderStayChoices(data) {
      const box=document.getElementById('stay-box'),list=document.getElementById('stay-options'),heading=document.getElementById('stay-heading'),helper=document.getElementById('stay-helper');
      const options=data.stayOptions||[];
      box.hidden=false;
      if(!options.length){heading.textContent='Pick your dates';helper.textContent=data.complimentary?'Choose any open dates that work for you. This stay is our treat, with no rent, taxes, government lodging fees, or required charges.':data.privatePricingConnected?'Choose any open dates that work for you. Your private Friends & Family pricing is already connected and will appear as you choose.':'Choose any open dates that work for you. Your Friends & Family rate will appear automatically if your phone number matches our private list.';list.innerHTML='<article class="stay-option"><div><strong>Midweek or weekend—choose what works best.</strong><div class="stay-meta">The live calendar shows what is currently open.</div></div><a class="choose" href="/register.html">View open dates</a></article>';return;}
      const selected=Number.isInteger(data.selectedStayChoice)?data.selectedStayChoice:null;
      if(selected!==null){ heading.textContent='Your reserved stay'; helper.textContent='This is the stay choice on your reservation. The other offered dates have been released.'; }
      else { heading.textContent=options.length===1?'Confirm your stay':'Choose your stay'; helper.textContent='Each option has its own deadline. If one expires, only that option is released; your other unexpired choices remain available.'; }
      list.innerHTML=options.map((option,index)=>{ const isSelected=selected===index; const cost=option.complimentary?'<div class="stay-meta"><strong>Our guest · complimentary stay</strong><br>No rent, taxes, or government lodging fees.</div>':option.costCents?`<div class="stay-meta">Listed cost: <strong>$${(option.costCents/100).toFixed(2)}</strong><br>Does not include <strong>$${(estimatedTaxesAndFees(option)/100).toFixed(2)}</strong> in estimated taxes and fees.</div>`:''; const deadline=option.expiresOn?`<div class="stay-meta deadline">Choose by ${formatStayDate(option.expiresOn)}. After that, this option is freed for others.</div>`:'<div class="stay-meta">No automatic expiration for this option.</div>'; const action=isSelected?'<strong>Selected</strong>':selected!==null?'':option.expired?'<button class="choose" disabled>Expired</button>':`<button class="choose" data-choice="${index+1}">Choose this stay</button>`; return `<article class="stay-option ${isSelected?'selected':''} ${option.expired?'expired':''}"><div><strong>Option ${index+1}: ${formatStayDate(option.arrival)} to ${formatStayDate(option.departure)}</strong>${cost}${deadline}</div>${action}</article>`; }).join('');
      list.querySelectorAll('[data-choice]').forEach((button)=>button.addEventListener('click',()=>selectStay(Number(button.dataset.choice),button)));
    }
    async function loadWelcome() {
      try {
        const response = await fetch('/api/invite-profile', { cache:'no-store' });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Your invitation could not be loaded.');
        document.getElementById('visitor-heading').textContent = `Welcome, ${escapeText(data.visitorName)}.`;
        document.getElementById('invite-label').textContent = escapeText(data.inviteLabel);
        document.getElementById('message').textContent = escapeText(data.welcomeMessage) || `We made this welcome just for ${escapeText(data.inviteLabel)}. Settle in, breathe out, and make yourselves at home.`;
        if(data.bookingPacketUrl){const packet=document.getElementById('booking-packet-link');packet.href=data.bookingPacketUrl;packet.hidden=false;}
        renderStayChoices(data);
        const customPhoto = escapeText(data.inviteLabel).toLowerCase() === 'do vibers' ? '/guests/DO_Vibers.webp' : '';
        const defaultPhoto = '/guests/weeks-creek-haven-friends-family-welcome-5x5.png';
        const photos = data.photos || [];
        const photoBox = document.getElementById('photos');
        photoBox.className = customPhoto || !photos.length ? 'photos count-1 feature-art' : `photos count-${photos.length}`;
        if (customPhoto) {
          photoBox.innerHTML = `<img src="${customPhoto}" alt="Welcome to Weeks Creek Haven, DO Vibers">`;
        } else if (photos.length) {
          photoBox.innerHTML = photos.map((photo,index) => `<img src="/api/invite-photo?photoId=${encodeURIComponent(photo.id)}" alt="Welcome photo ${index + 1}">`).join('');
        } else {
          photoBox.innerHTML = `<img src="${defaultPhoto}" alt="Welcome to Weeks Creek Haven Friends and Family in beautiful Blue Ridge">`;
        }
        document.getElementById('loading').hidden = true;
        document.getElementById('welcome-card').hidden = false;
      } catch (error) {
        document.getElementById('loading').hidden = true;
        document.getElementById('error-message').textContent = error.message;
        document.getElementById('error').hidden = false;
      }
    }
    loadWelcome();
  </script>
</body>
</html>
