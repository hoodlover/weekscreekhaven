<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Owner Calendar | Weeks Creek Haven</title>
  <link rel="icon" type="image/webp" href="webpic/Weeks_Creek_Haven_Favicon.webp">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@600;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#332820; --pine:#183c2d; --cream:#f4eee0; --paper:#fffdf8; --muted:#74685e; --line:#ded4c5; --request:#f1c96b; --reserved:#79a8c3; --booked:#5d9b70; --blocked:#887b72; --danger:#8a2f2f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:Montserrat,sans-serif; background:#17130f url('webpic/lightbardwood.webp') center/cover fixed; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    .shell { width:min(1500px,calc(100% - 24px)); margin:auto; padding:22px 0 60px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; color:white; margin-bottom:18px; }
    .brand { display:flex; align-items:center; gap:13px; }
    .brand img { width:52px; height:52px; border-radius:50%; border:2px solid #ffffff88; }
    h1,h2,h3 { font-family:'Crimson Text',serif; margin:0; }
    h1 { font-size:clamp(2rem,4vw,3.2rem); line-height:.95; }
    .eyebrow { color:#ddb083; text-transform:uppercase; letter-spacing:.18em; font-size:.64rem; font-weight:800; margin-bottom:5px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .ghost { border:1px solid #ffffff66; background:#0004; color:white; text-decoration:none; border-radius:999px; padding:9px 14px; font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:15px; align-items:start; }
    .panel { background:rgba(255,253,248,.98); border:1px solid var(--line); border-radius:18px; box-shadow:0 15px 45px #0006; }
    .calendar-panel { padding:20px; min-width:0; }
    .calendar-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:15px; }
    .calendar-head h2 { color:var(--pine); font-size:2.25rem; }
    .month-actions { display:flex; align-items:center; gap:7px; }
    .month-actions button,.small { border:1px solid var(--line); background:white; border-radius:8px; padding:9px 12px; color:var(--ink); font-weight:800; }
    .weekdays,.calendar { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
    .weekdays div { padding:8px; text-align:center; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-size:.62rem; font-weight:800; }
    .day { min-height:125px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:7px; background:#fff; overflow:hidden; }
    .day:nth-child(7n+1) { border-left:1px solid var(--line); }
    .day:nth-child(-n+7) { border-top:1px solid var(--line); }
    .day.outside { background:#f1ece3; color:#aaa096; }
    .day.today { box-shadow:inset 0 0 0 2px var(--pine); }
    .day-number { font-size:.72rem; font-weight:800; margin-bottom:5px; }
    .event { display:block; width:100%; border:0; text-align:left; border-radius:5px; margin:3px 0; padding:5px 6px; font-size:.6rem; line-height:1.25; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#251d17; }
    .event.request { background:var(--request); } .event.reserved { background:var(--reserved); color:#102b39; } .event.booked { background:var(--booked); color:white; } .event.blocked { background:var(--blocked); color:white; }
    .sidebar { display:grid; gap:15px; }
    .side-panel { padding:20px; }
    .side-panel h3 { color:var(--pine); font-size:1.55rem; }
    .helper { color:var(--muted); font-size:.72rem; line-height:1.5; }
    label { display:block; margin-top:12px; text-transform:uppercase; letter-spacing:.1em; font-size:.62rem; font-weight:800; }
    input { width:100%; margin-top:6px; padding:10px; border:1px solid #cfc4b4; border-radius:8px; }
    .primary { width:100%; border:0; background:var(--pine); color:white; border-radius:999px; padding:11px 15px; margin-top:14px; text-transform:uppercase; letter-spacing:.08em; font-size:.68rem; font-weight:800; }
    .legend { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:13px; font-size:.65rem; color:var(--muted); }
    .key { display:flex; gap:7px; align-items:center; }
    .dot { width:11px; height:11px; border-radius:3px; }
    .list { display:grid; gap:9px; margin-top:13px; max-height:420px; overflow:auto; }
    .item { border:1px solid var(--line); border-left:5px solid var(--blocked); border-radius:8px; padding:10px; font-size:.7rem; line-height:1.45; }
    .item.request { border-left-color:var(--request); } .item.reserved { border-left-color:var(--reserved); } .item.booked { border-left-color:var(--booked); }
    .item strong { display:block; font-size:.76rem; }
    .item-actions { display:flex; gap:6px; margin-top:7px; }
    .item-actions button { border:1px solid var(--line); background:white; border-radius:6px; padding:6px 7px; font-size:.58rem; font-weight:800; text-transform:uppercase; }
    .item-actions .danger { color:var(--danger); }
    .error { background:#fff0f0; color:var(--danger); padding:10px; border-radius:8px; margin-top:10px; font-size:.72rem; font-weight:700; }
    @media(max-width:1000px) { .layout { grid-template-columns:1fr; } .sidebar { grid-template-columns:1fr 1fr; } }
    @media(max-width:700px) { .shell { width:min(100% - 10px,1500px); } .calendar-panel { padding:10px; overflow-x:auto; } .calendar-wrap { min-width:850px; } .sidebar { grid-template-columns:1fr; } .topbar { align-items:flex-start; } .day { min-height:105px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><img src="webpic/Weeks_Creek_Haven_Favicon.webp" alt=""><div><div class="eyebrow">Private owner tools</div><h1>Cabin Calendar</h1></div></div>
      <div class="actions"><a class="ghost" href="/admin.html">Admin Hub</a><a class="ghost" href="/index.html">Home</a></div>
    </header>
    <div class="layout">
      <section class="panel calendar-panel">
        <div class="calendar-wrap">
          <div class="calendar-head"><div><div class="eyebrow">Requests &amp; stays</div><h2 id="month-title"></h2></div><div class="month-actions"><button id="previous" aria-label="Previous month">&larr;</button><button id="today">Today</button><button id="next" aria-label="Next month">&rarr;</button></div></div>
          <div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
          <div id="calendar" class="calendar"></div>
        </div>
      </section>
      <aside class="sidebar">
        <section class="panel side-panel">
          <div class="eyebrow">Owner hold</div><h3>Block dates</h3><p class="helper">Use this for personal visits, maintenance, or any dates you do not want guests to request.</p>
          <form id="block-form"><label>Reason<input id="block-label" maxlength="100" placeholder="Family weekend" required></label><label>Start<input id="block-arrival" type="date" required></label><label>End / checkout<input id="block-departure" type="date" required></label><button class="primary">Block these dates</button><div id="block-error" class="error" hidden></div></form>
          <div class="legend"><span class="key"><i class="dot" style="background:var(--request)"></i>Request</span><span class="key"><i class="dot" style="background:var(--reserved)"></i>Reserved</span><span class="key"><i class="dot" style="background:var(--booked)"></i>Booked</span><span class="key"><i class="dot" style="background:var(--blocked)"></i>Owner blocked</span></div>
        </section>
        <section class="panel side-panel"><div class="eyebrow">Coming up</div><h3>Calendar items</h3><div id="item-list" class="list"></div></section>
      </aside>
    </div>
  </main>
  <script>
    const state={bookings:[],blocks:[],month:new Date(new Date().getFullYear(),new Date().getMonth(),1)};
    const $=(id)=>document.getElementById(id); const esc=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const key=(date)=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    const request=async(url,options={})=>{ const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}); const data=await response.json().catch(()=>({})); if(response.status===401){ location.href='/admin.html'; throw new Error('Owner sign-in required.'); } if(!response.ok) throw new Error(data.error||'Something went wrong.'); return data; };
    const normalizedStatus=(status)=>status==='approved'?'reserved':status;
    function events(){
      const result=[];
      for(const booking of state.bookings){ const status=normalizedStatus(booking.status||'pending');
        if(status==='pending'){ (booking.dateChoices||[]).forEach((dates,index)=>result.push({...dates,type:'request',label:`${booking.name} · choice ${index+1}`,bookingId:booking.id,dateChoice:index+1,status})); }
        if(['reserved','booked'].includes(status)){ const dates=booking.dateChoices?.[Number.isInteger(booking.approvedChoice)?booking.approvedChoice:0]; if(dates) result.push({...dates,type:status,label:booking.name,bookingId:booking.id,status}); }
      }
      for(const block of state.blocks) result.push({...block,type:'blocked',blockId:block.id});
      return result;
    }
    function render(){
      $('month-title').textContent=new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(state.month);
      const start=new Date(state.month); start.setDate(1-start.getDay()); const all=events(); const today=key(new Date()); let html='';
      for(let index=0;index<42;index++){ const date=new Date(start); date.setDate(start.getDate()+index); const dateKey=key(date); const outside=date.getMonth()!==state.month.getMonth(); const dayEvents=all.filter(event=>dateKey>=event.arrival&&dateKey<event.departure);
        html+=`<div class="day ${outside?'outside':''} ${dateKey===today?'today':''}"><div class="day-number">${date.getDate()}</div>${dayEvents.map(event=>`<div class="event ${event.type}" title="${esc(event.label)}">${esc(event.label)}</div>`).join('')}</div>`;
      }
      $('calendar').innerHTML=html;
      const upcoming=all.filter(event=>event.departure>=today).sort((a,b)=>a.arrival.localeCompare(b.arrival));
      $('item-list').innerHTML=upcoming.length?upcoming.map(event=>`<article class="item ${event.type}"><strong>${esc(event.label)}</strong>${esc(event.arrival)} to ${esc(event.departure)}<div class="item-actions">${event.type==='request'?`<button data-reserve="${esc(event.bookingId)}" data-choice="${event.dateChoice}">Reserve this choice</button>`:''}${event.type==='reserved'?`<button data-booked="${esc(event.bookingId)}">Mark booked</button><button class="danger" data-cancel="${esc(event.bookingId)}">Cancel</button>`:''}${event.type==='booked'?`<button class="danger" data-cancel="${esc(event.bookingId)}">Cancel</button>`:''}${event.type==='blocked'?`<button class="danger" data-remove-block="${esc(event.blockId)}">Remove block</button>`:''}</div></article>`).join(''):'<p class="helper">Nothing upcoming yet.</p>';
    }
    async function load(){ const data=await request('/api/admin-calendar'); state.bookings=data.bookings||[]; state.blocks=data.blocks||[]; render(); }
    $('previous').onclick=()=>{ state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1); render(); };
    $('next').onclick=()=>{ state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1); render(); };
    $('today').onclick=()=>{ const now=new Date(); state.month=new Date(now.getFullYear(),now.getMonth(),1); render(); };
    $('block-form').addEventListener('submit',async(event)=>{ event.preventDefault(); $('block-error').hidden=true; try{ await request('/api/admin-calendar',{method:'POST',body:JSON.stringify({label:$('block-label').value,arrival:$('block-arrival').value,departure:$('block-departure').value})}); event.target.reset(); await load(); }catch(error){ $('block-error').textContent=error.message; $('block-error').hidden=false; } });
    $('item-list').addEventListener('click',async(event)=>{ const reserve=event.target.closest('[data-reserve]'); const booked=event.target.closest('[data-booked]'); const cancel=event.target.closest('[data-cancel]'); const remove=event.target.closest('[data-remove-block]'); try{ if(reserve&&confirm('Reserve this date choice? It will become unavailable to new requests.')) await request('/api/admin-calendar',{method:'PATCH',body:JSON.stringify({action:'reserve-request',bookingId:reserve.dataset.reserve,dateChoice:reserve.dataset.choice})}); if(booked) await request('/api/admin-calendar',{method:'PATCH',body:JSON.stringify({action:'mark-booked',bookingId:booked.dataset.booked})}); if(cancel&&confirm('Cancel this reservation and reopen the dates?')) await request('/api/admin-calendar',{method:'PATCH',body:JSON.stringify({action:'cancel-booking',bookingId:cancel.dataset.cancel})}); if(remove&&confirm('Remove this owner block?')) await request('/api/admin-calendar',{method:'PATCH',body:JSON.stringify({action:'remove-block',blockId:remove.dataset.removeBlock})}); await load(); }catch(error){ alert(error.message); } });
    load().catch(()=>{});
  </script>
</body>
</html>
